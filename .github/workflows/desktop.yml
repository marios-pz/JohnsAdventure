# Desktop builds: one self-contained executable per platform (game data embedded).
name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']          # a version tag also publishes a GitHub Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # creating the release and uploading its assets

env:
  GODOT_VERSION: 4.7.2

jobs:
  desktop:
    runs-on: ubuntu-latest  # Godot exports Windows builds from Linux too
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            preset: Linux
            file: JohnsAdventure.x86_64
            templates: templates/linux_*.x86_64
          - platform: windows
            preset: Windows Desktop
            file: JohnsAdventure.exe
            templates: templates/windows_*_x86_64*.exe
    steps:
      - uses: actions/checkout@v4

      # Tag builds are named after the tag (v1.0.0), everything else after the commit (dev-39e338a).
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # The full template archive is ~1.3 GB: download it once, keep only what this build needs.
      - name: Cache Godot and ${{ matrix.platform }} templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ matrix.platform }}

      - name: Install Godot and ${{ matrix.platform }} templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/godot "$templates"
          curl -sSfL "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSfL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          unzip -q -j templates.tpz 'templates/version.txt' '${{ matrix.templates }}' -d "$templates"
          rm godot.zip templates.tpz

      - name: Import assets
        run: ~/godot/godot --headless --path . --import

      - name: Smoke test
        if: matrix.platform == 'linux'
        run: ~/godot/godot --headless --path . -s tests/smoke_test.gd

      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p build/${{ matrix.platform }}
          ~/godot/godot --headless --path . --export-release "${{ matrix.preset }}" build/${{ matrix.platform }}/${{ matrix.file }}

      # Linux: a tarball keeps the executable bit (artifacts and zips from here drop it).
      # Windows: zipped, which also shrinks the ~110 MB exe for the download.
      - name: Package
        run: |
          name="JohnsAdventure-$VERSION-${{ matrix.platform }}"
          cd build/${{ matrix.platform }}
          if [ "${{ matrix.platform }}" = linux ]; then
            tar -czf "../$name.tar.gz" ${{ matrix.file }} && echo "PACKAGE=build/$name.tar.gz" >> "$GITHUB_ENV"
          else
            zip -q "../$name.zip" ${{ matrix.file }} && echo "PACKAGE=build/$name.zip" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: johns-adventure-${{ env.VERSION }}-${{ matrix.platform }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

      # Both workflows attach to the same release: whichever runs first creates it.
      - name: Publish to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --title "John's Adventure $VERSION" --generate-notes || true
          gh release upload "$VERSION" "$PACKAGE" --clobber
